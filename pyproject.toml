[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slingsearch"
version = "0.1.0"
readme = "README.md"
description = "Multi-provider search with measurable global evidence ranking"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/sileod/slingsearch"
Documentation = "https://github.com/sileod/slingsearch#readme"

[project.optional-dependencies]
extract = ["trafilatura>=2"]
bench = ["ir-measures>=0.3", "datasets>=3", "ijson>=3", "tiktoken>=0.7"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22"]
mcp = ["mcp>=1.10,<2"]

[project.scripts]
slingsearch = "slingsearch.cli:main"
slingsearch-mcp = "slingsearch.mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/slingsearch", "benchmarks"]
exclude = ["benchmarks/reports/**"]
